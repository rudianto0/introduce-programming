<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hari 33 - Project To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; line-height: 1.6; }
    h1 { margin-bottom: 4px; }
    #info { color: #666; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 16px 0; }
    input[type="text"] { flex: 1; padding: 10px; font-size: 15px; }
    button { padding: 10px 16px; cursor: pointer; border: none; border-radius: 6px; background: #2b7de9; color: #fff; }
    button:hover { background: #1f66c4; }
    ul { list-style: none; padding: 0; }
    li.item { display: flex; align-items: center; gap: 10px; background: #f6f8fa;
              padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; }
    li.item span { flex: 1; }
    li.item.selesai span { text-decoration: line-through; color: #999; }
    li.item button { background: #e5484d; padding: 6px 10px; font-size: 13px; }
    li.item button:hover { background: #c53b40; }
    #hapusSelesai { background: #6b7280; margin-top: 8px; }
    #hapusSelesai:hover { background: #4b5563; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>
  <p id="info">0 tugas</p>

  <form id="form">
    <input id="inputTugas" type="text" placeholder="Tugas baru..." autocomplete="off">
    <button type="submit">Tambah</button>
  </form>

  <ul id="daftarTugas"></ul>

  <button id="hapusSelesai">Hapus yang selesai</button>

  <script src="script.js"></script>
</body>
</html>
