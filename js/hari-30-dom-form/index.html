<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hari 30 - DOM Form dan Daftar Dinamis</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; line-height: 1.6; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center;
         background: #f6f8fa; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; }
    #kosong { color: #888; font-style: italic; }
    #output { background: #eef6ff; border-left: 4px solid #2b7de9; padding: 12px 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Hari 30 - Daftar Dinamis</h1>
  <p>Ketik item lalu tekan Tambah. Setiap item punya tombol Hapus sendiri.</p>

  <form id="form">
    <input id="inputItem" type="text" placeholder="Tulis item belanja...">
    <button type="submit">Tambah</button>
  </form>

  <p id="kosong">Daftar masih kosong.</p>
  <ul id="daftar"></ul>

  <p id="output">Jumlah item: 0</p>

  <script src="script.js"></script>
</body>
</html>
