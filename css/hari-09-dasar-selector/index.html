<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 09 - Dasar Selector</title>

    <!-- 2) INTERNAL CSS: written inside a <style> tag in the head -->
    <style>
        h1 {
            color: #2c3e50;
        }
    </style>

    <!-- 3) EXTERNAL CSS: the main way, loaded from a separate file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- 1) INLINE CSS: written with the style attribute -->
        <p style="color: #e67e22;">Halo, saya sedang belajar CSS!</p>

        <h1 id="nama">Rudi Pratama</h1>
        <p class="pekerjaan">Web Developer Pemula</p>
        <p class="deskripsi">Saya sudah belajar HTML, sekarang lanjut CSS.</p>

        <a class="tombol" href="#">Hubungi Saya</a>
    </div>
</body>
</html>
