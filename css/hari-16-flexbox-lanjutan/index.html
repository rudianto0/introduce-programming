<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 16 - Flexbox Lanjutan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="banner">
            <h1>Rudi Pratama</h1>
        </div>

        <p class="seksi">Galeri (flex-wrap + gap)</p>
        <div class="galeri">
            <div class="kotak">1</div>
            <div class="kotak">2</div>
            <div class="kotak">3</div>
            <div class="kotak">4</div>
            <div class="kotak">5</div>
            <div class="kotak">6</div>
        </div>

        <p class="seksi">Flex-grow (kotak tengah melebar)</p>
        <div class="baris-grow">
            <div class="kotak kecil">A</div>
            <div class="kotak tumbuh">B</div>
            <div class="kotak kecil">C</div>
        </div>
    </div>
</body>
</html>
