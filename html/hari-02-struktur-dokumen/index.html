<!DOCTYPE html>
<!-- The doctype above tells the browser this is an HTML5 document -->
<html lang="id">
<head>
    <!-- The head contains information ABOUT the page, not visible content -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contoh struktur dokumen HTML">
    <title>Hari 02 - Struktur Dokumen</title>
</head>
<body>
    <!-- The body contains everything the user actually sees -->
    <h1>Struktur Dokumen HTML</h1>
    <p>Halaman ini menunjukkan bagian head dan body secara lengkap.</p>
    <p>Lihat judul di tab browser: itu berasal dari tag title.</p>
</body>
</html>
